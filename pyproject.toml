[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "analytics-agent"
version = "0.1.0"
description = "LangGraph data analytics agent with a stable input/output contract for subgraph use."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/analytics_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
