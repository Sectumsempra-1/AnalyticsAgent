[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "analytics-agent"
version = "0.1.0"
description = "LangGraph data analytics agent with a stable input/output contract for subgraph use."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "duckdb>=2.0,<3",  # tools rely on 2.x cursor + allowed_paths behavior
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "scipy>=1.11",  # used by model-written analysis code in the sandbox
    "langgraph==1.2.19",
    "langchain>=1.4,<2",  # init_chat_model: provider-agnostic model loading
    "langchain-core>=1.7,<2",
    "python-dotenv>=1",
]

[project.scripts]
analytics-agent = "analytics_agent.cli:main"

[project.optional-dependencies]
# Install the provider package for the model you use, e.g. pip install -e ".[ollama]"
ollama = ["langchain-ollama>=1.1,<2"]
openai = ["langchain-openai>=1.7,<2"]
evals = ["reportlab>=4"]  # PDF eval reports
dev = [
    "pytest>=8",
    "langchain-ollama>=1.1,<2",
    "reportlab>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/analytics_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: end-to-end runs against the real configured model (slow)"]
addopts = "-m 'not smoke'"
filterwarnings = [
    # langsmith (a langchain dependency) uses an API deprecated in Python 3.14; not our code
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith",
]
