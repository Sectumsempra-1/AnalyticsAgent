[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "analytics-agent"
version = "0.1.0"
description = "LangGraph data analytics agent with a stable input/output contract for subgraph use."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "duckdb>=2.0,<3",  # tools rely on 2.x cursor + allowed_paths behavior
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "scipy>=1.11",  # used by model-written analysis code in the sandbox
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/analytics_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
